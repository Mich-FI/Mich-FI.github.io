
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Winter Snowfall</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: linear-gradient(
        180deg,
        #061535 0%,
        #0b2f68 45%,
        #1764a5 100%
      );
      font-family: Arial, sans-serif;
    }

    .winter-background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(
          ellipse at 50% 0%,
          rgba(80, 160, 255, 0.22),
          transparent 60%
        ),
        linear-gradient(
          180deg,
          #061535 0%,
          #0b2f68 50%,
          #1764a5 100%
        );
    }

    /* Subtle blue glow */
    .glow {
      position: absolute;
      width: 70vw;
      height: 70vw;
      max-width: 800px;
      max-height: 800px;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        circle,
        rgba(80, 170, 255, 0.12),
        transparent 70%
      );
      pointer-events: none;
    }

    /* Snow particles */
    #snow {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Optional centered text */
    .content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      color: rgba(255, 255, 255, 0.92);
      pointer-events: none;
    }

    .content h1 {
      font-size: clamp(2.5rem, 7vw, 6rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      text-shadow: 0 0 35px rgba(160, 215, 255, 0.35);
    }

    .content p {
      margin-top: 16px;
      font-size: clamp(0.8rem, 2vw, 1.1rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(220, 240, 255, 0.7);
    }

    @media (prefers-reduced-motion: reduce) {
      .content h1 {
        text-shadow: none;
      }
    }
  </style>
</head>

<body>
  <div class="winter-background">
    <div class="glow"></div>
    <canvas id="snow"></canvas>

    <!-- Remove this section if you want only the background -->
    <div class="content">
      <h1>WINTER</h1>
      <p>A quiet snowfall</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("snow");
    const ctx = canvas.getContext("2d");

    let width;
    let height;
    let snowflakes = [];
    let animationId;

    const SNOW_COUNT = 180;
    const reduceMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      createSnowflakes();
      drawSnow();
    }

    function createSnowflakes() {
      snowflakes = [];

      for (let i = 0; i < SNOW_COUNT; i++) {
        snowflakes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 2.5 + 0.5,
          speed: Math.random() * 1.1 + 0.25,
          drift: Math.random() * 0.6 - 0.3,
          opacity: Math.random() * 0.65 + 0.25,
          phase: Math.random() * Math.PI * 2,
          twinkleSpeed: Math.random() * 0.025 + 0.005
        });
      }
    }

    function drawSnow() {
      ctx.clearRect(0, 0, width, height);

      for (const flake of snowflakes) {
        const twinkle =
          0.75 + Math.sin(flake.phase) * 0.25;

        ctx.beginPath();
        ctx.arc(
          flake.x,
          flake.y,
          flake.radius,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          `rgba(235, 247, 255, ${flake.opacity * twinkle})`;

        ctx.shadowBlur = flake.radius > 1.8 ? 10 : 4;
        ctx.shadowColor = "rgba(180, 225, 255, 0.8)";
        ctx.fill();

        flake.phase += flake.twinkleSpeed;

        if (!reduceMotion) {
          flake.y += flake.speed;
          flake.x +=
            flake.drift + Math.sin(flake.phase) * 0.25;

          if (flake.y > height + 5) {
            flake.y = -5;
            flake.x = Math.random() * width;
          }

          if (flake.x > width + 5) flake.x = -5;
          if (flake.x < -5) flake.x = width + 5;
        }
      }

      ctx.shadowBlur = 0;

      if (!reduceMotion) {
        animationId = requestAnimationFrame(drawSnow);
      }
    }

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
  </script>
</body>
</html>
